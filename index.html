function importAnalysis(raw){let t=raw.trim(),m=t.match(/^\s*(?:\*\*)?ZERO_REPORT[:：]\s*(日次|週次|月次|年次):(\d{4}\/\d{1,2}\/\d{1,2})(?:\*\*)?\s*$/m),k=m?m[1]+':'+m[2]:data.pendingAnalysisKey;if(!k||!t)throw Error('分析期間を特定できません。先にZERO.から分析を開始してください。');if(!m&&!confirm('分析結果を '+k+' に保存しますか？'))return;let qs=t.split('\n').map(s=>s.match(/^\s*(?:[-*]\s*)?(?:\*\*)?ZERO_Q[:：]\s*(.*?)\s*$/)).filter(Boolean).map(m=>m[1].replace(/\*\*$/,'').trim()).filter(Boolean).slice(0,3);data.aiReports=data.aiReports||{};let old=data.aiReports[k]||{};if(old.result&&old.result!==t&&!confirm(k+' の分析結果を更新しますか？'))return;data.aiReports[k]={...old,result:t,updated:new Date().toISOString()};data.aiQuestions=data.aiQuestions||{};for(let q of qs){let id=k+'|'+q;if(!data.aiQuestions[id])data.aiQuestions[id]={text:q,source:k}}persist();renderAIQuestions();$('status').textContent=k+' の分析を保存しました。抽出 '+qs.length+'問';}
$('importAnalysis').onclick=async()=>{try{importAnalysis(await navigator.clipboard.readText())}catch(e){let t=prompt('分析結果を貼り付けてください');if(t)try{importAnalysis(t)}catch(err){$('status').textContent=err.message}}};
