const $=x=>document.getElementById(x),key='zero-v1';let data={notes:[],draft:null};try{data=JSON.parse(localStorage.getItem(key))||data}catch(e){}let activeQuestion=null;let start=null,ended=false,elapsed=0,composing=false;const day=()=>new Date().toLocaleDateString('ja-JP'),rows=()=>$('body').value.split('\n').map(x=>x.replace(/^\s*・/,'').trim()).filter(Boolean);function persist(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){$('status').textContent='保存失敗。バックアップしてください'}}function draft(){data.draft={title:$('title').value,body:$('body').value,start,ended,elapsed,questionDay:activeQuestion,category:$('category').value,self:$('self').checked};persist()}function progress(){let n=data.notes.filter(x=>x.day===day()).length;$('total').textContent=n+' / 10 枚';$('progress').value=n;$('page').textContent='今日の'+(n+1)+'枚目'}function tick(){let s=ended?Math.max(0,60-elapsed):start===null?60:Math.max(0,60-Math.floor((Date.now()-start)/1000));$('clock').textContent='0'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('count').textContent=rows().length+' 項目';if(!ended){$('body').readOnly=false;$('title').readOnly=false}if(s===0&&!ended){$('status').textContent='60秒経過。引き続き書き足せます。';$('clock').style.color='#d65c55'}else{$('clock').style.color=''}}function begin(){if(start===null&&!ended&&rows().length)start=Date.now();draft();tick()}function normalize(){let b=$('body'),old=b.value,p=b.selectionStart,f=s=>s.split('\n').map(x=>x&&!x.startsWith('・')?'・'+x:x).join('\n');if(f(old)!==old){b.value=f(old);let q=f(old.slice(0,p)).length;b.setSelectionRange(q,q)}}$('title').oninput=draft;$('body').oncompositionstart=()=>composing=true;$('body').oncompositionend=()=>{composing=false;normalize();begin()};$('body').oninput=e=>{if(!e.isComposing)normalize();begin()};$('body').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&!composing&&!ended){e.preventDefault();let b=$('body');b.setRangeText('\n・',b.selectionStart,b.selectionEnd,'end');begin()}};const rules=[['金銭関係',/お金|金銭|家計|貯金|  let settings=add('details','');add('summary',mode.value+'専用ChatGPTの設定',settings);add('p','ChatGPTで分析専用チャットを作り、その会話のURLを登録してください。',settings);let url=add('input','',settings);url.type='url';url.placeholder='https://chatgpt.com/share/6b06bf8b-b248-83e8-8182-a752084cc661';url.value=(data.analysisChats||{})[mode.value]||'';let notice=add('p','',settings);let bulk=add('textarea','',settings);bulk.placeholder='4つのURLをまとめて登録する設定JSON';add('button','一括登録',settings).onclick=()=>{try{let x=JSON.parse(bulk.value),v={};for(let k of ['日次','週次','月次','年次']){let u=new URL(x[k]);if(u.origin!=='https://chatgpt.com'||!/^\/(?:g\/[^/]+\/)?c\/[a-zA-Z0-9-]+\/?$/.test(u.pathname))throw Error();v[k]=u.origin+u.pathname}data.analysisChats=v;persist();url.value=v[mode.value];notice.textContent='4つのチャットを登録しました';bulk.value=''}catch(e){notice.textContent='設定形式を確認してください'}};add('button','チャットURLを保存',settings).onclick=()=>{try{let u=new URL(url.value.trim());if(u.origin!=='https://chatgpt.com'||!/^\/(?:g\/[^/]+\/)?c\/[a-zA-Z0-9-]+\/?$/.test(u.pathname))throw Error();data.analysisChats=data.analysisChats||{};data.analysisChats[mode.value]=u.origin+u.pathname;persist();notice.textContent='登録しました'}catch(e){notice.textContent='ChatGPTの個別会話URLを入力してください'}};let copy=add('button','コピーしてChatGPTを開く');copy.disabled=!notes.length;copy.onclick=async()=>{let target=(data.analysisChats||{})[mode.value];if(!target){settings.open=true;notice.textContent='先に分析専用チャットのURLを登録してください';return}try{await navigator.clipboard.writeText(prompt.value);msg.textContent='コピーしました。ChatGPTに貼り付けてください。';location.href=target}catch(e){prompt.focus();prompt.select();msg.textContent='コピーできませんでした。手動でコピーしてください。'}};let only=add('button','コピーのみ');only.disabled=!notes.length;only.onclick=async()=>{try{await navigator.clipboard.writeText(prompt.value);msg.textContent='コピーしました'}catch(e){prompt.focus();prompt.select();msg.textContent='手動でコピーしてください'}};let download=add('button','分析用データを保存');download.disabled=!notes.length;download.onclick=()=>{let u=  let msg=add('p','');add('h3','AI分析結果');let result=add('textarea','');result.placeholder='ChatGPTの回答を貼り付ける';add('h3','自分の感想・反論・気づき');let comment=add('textarea','');let saved=data.aiReports[key]||{};result.value=saved.result||'';comment.value=saved.comment||'';

const questions=["もし誰からも評価されず、収入や社会的地位にも差がないとしたら、俺は何に人生の時間を使いたいか？","最近、心から充実していた瞬間には何があったか？","絶対に失いたくない自由とは何か？","尊敬する人のどんな行動に惹かれるか？","どんな成功なら手に入れても嬉しくないか？","何を知るためなら時間を忘れられるか？","どんな人といると自然体でいられるか？","過去の選択で最も誇りに思うものは何か？","何にお金を使うと本当に満足するか？","どんな不公平に最も怒りを感じるか？","自分の仕事で誰にどんな変化を届けたいか？","どんな失敗なら挑戦したことを後悔しないか？","他人を羨ましく思うとき、本当は何が欲しいか？","理想の平日はどんな一日か？","何をしているときに自分らしいと感じるか？","どんな責任なら喜んで引き受けたいか？","自分にとって十分な生活とは何か？","誰にも理解されなくても守りたい信念は何か？","子供の頃から変わらない関心は何か？","何を学ぶと世界の見え方が変わるか？","どんな環境なら能力を発揮しやすいか？","安心と挑戦のどちらを求める場面が多いか？","最近の後悔は何を大切にしている証拠か？","自分が人に与えたいものは何か？","どんな努力に意味を感じるか？","何を手放せばもっと自由になれるか？","自分にとって親密な関係とは何か？","どんな未来を想像すると楽しみになるか？","人生で譲れない判断基準は何か？","80歳の自分は今の自分に何を望むか？"];
function todayQuestion(){let n=new Date(),i=Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(2026,10,25))/86400000);return questions[((i%questions.length)+questions.length)%questions.length]}
function updateQuestion(){let q=todayQuestion(),done=data.notes.some(n=>n.questionDay===day());$('questionText').textContent=q;$('questionStart').disabled=done;$('questionStart').textContent=done?'今日の回答済み':'この問いを書く'}
$('questionStart').onclick=()=>{if(activeQuestion===day()){$('body').focus();return}if(ended||$('title').value.trim()||$('body').value.trim()){$('status').textContent='今のメモを保存してから今日の問いを書いてください。';return}activeQuestion=day();$('title').value=todayQuestion();$('category').value='自己分析';draft();$('body').focus()};
$('questionHistory').onclick=()=>{$('editor').hidden=$('library').hidden=true;$('report').hidden=false;$('reportTitle').textContent='今日の問い・回答履歴';$('reportControls').replaceChildren();let out=$('reportBody');out.replaceChildren();for(let n of data.notes.filter(n=>n.questionDay)){let d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=n.questionDay+' '+n.title;p.textContent=n.body;d.append(s,p);out.append(d)}if(!out.children.length)out.textContent='まだ回答がありません。'};
updateQuestion();setInterval(updateQuestion,30000);
</script></html>
