<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>ZERO</title><style>*{box-sizing:border-box}body{font:16px system-ui;max-width:600px;margin:auto;padding:20px;background:#f5f5ef;color:#233b32}header,nav{display:flex;justify-content:space-between;align-items:center;gap:8px}button,input,textarea{font:inherit;color:inherit;background:transparent;border:1px solid #88998f;border-radius:10px;padding:12px}button{min-height:44px}input,textarea,progress{width:100%}textarea{height:230px;line-height:1.8}section,article{border:1px solid #aab5ad;padding:16px;border-radius:14px;margin:12px 0}strong{font-size:20px}#clock{font-size:40px}progress{accent-color:#398060}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}[hidden]{display:none!important}@media(prefers-color-scheme:dark){body{background:#182622;color:#eee}}</style><header><h1>ZERO.</h1><strong id="total"></strong></header><progress id="progress" max="10"></progress><nav><button id="write">書く</button><button id="files">ファイル</button><button id="daily">振り返り</button><button id="analysis">分析</button><button id="backup">バックアップ</button></nav><p id="status" role="status"></p><main id="editor"><header><strong id="page"></strong><span id="clock">01:00</span></header><section><input id="title" placeholder="何について考える？"><textarea id="body" placeholder="・思いついたことを書き出す"></textarea><p id="count"></p><button id="finish">書き終える</button></section><small>1テーマ・1分・4〜6項目、各20〜30文字が目安。</small><section id="review" hidden><h2>振り返り</h2><div id="checks"></div><label><input type="checkbox" id="self" style="width:auto"> タイトルに沿って素直に書けた</label><p>分類（変更可能）</p><input id="category"><p><button id="next">保存して次のメモへ</button></p><small>形式チェックのみ。AIによる意味の評価は未実装。</small></section></main><main id="library" hidden><input id="search" placeholder="メモを検索"><div id="list"></div></main><main id="report" hidden><h2 id="reportTitle"></h2><div id="reportControls"></div><div id="reportBody"></div></main><script>
const $=x=>document.getElementById(x),key='zero-v1';let data={notes:[],draft:null};try{data=JSON.parse(localStorage.getItem(key))||data}catch(e){}let start=null,ended=false,elapsed=0,composing=false;const day=()=>new Date().toLocaleDateString('ja-JP'),rows=()=>$('body').value.split('\n').map(x=>x.replace(/^\s*・/,'').trim()).filter(Boolean);function persist(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){$('status').textContent='保存失敗。バックアップしてください'}}function draft(){data.draft={title:$('title').value,body:$('body').value,start,ended,elapsed,category:$('category').value,self:$('self').checked};persist()}function progress(){let n=data.notes.filter(x=>x.day===day()).length;$('total').textContent=n+' / 10 枚';$('progress').value=n;$('page').textContent='今日の'+(n+1)+'枚目'}function tick(){let s=ended?60-elapsed:start===null?60:Math.max(0,60-Math.floor((Date.now()-start)/1000));$('clock').textContent='0'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('count').textContent=rows().length+' 項目';if(s===0&&!ended&&!composing)finish()}function begin(){if(start===null&&!ended&&rows().length)start=Date.now();draft();tick()}function normalize(){let b=$('body'),old=b.value,p=b.selectionStart,f=s=>s.split('\n').map(x=>x&&!x.startsWith('・')?'・'+x:x).join('\n');if(f(old)!==old){b.value=f(old);let q=f(old.slice(0,p)).length;b.setSelectionRange(q,q)}}$('title').oninput=draft;$('body').oncompositionstart=()=>composing=true;$('body').oncompositionend=()=>{composing=false;normalize();begin()};$('body').oninput=e=>{if(!e.isComposing)normalize();begin()};$('body').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&!composing&&!ended){e.preventDefault();let b=$('body');b.setRangeText('\n・',b.selectionStart,b.selectionEnd,'end');begin()}};function classify(s){return Object.entries({'研究・学業':/研究|論文|大学|勉強|量子|英語/,'キャリア':/仕事|就活|企業|進路|博士/,'生活習慣':/睡眠|スマホ|運動|習慣|朝/,'人間関係':/彼女|友達|家族|先輩/,'自己分析':/自分|人生|幸せ|目標/}).filter(([k,r])=>r.test(s)).map(([k])=>k).join('、')||'その他'}function finish(restore=false){if(ended&&!restore)return;if(!rows().length&&!$('title').value.trim()){start=null;return}if(!restore)elapsed=start===null?0:Math.min(60,Math.floor((Date.now()-start)/1000));ended=true;$('title').readOnly=$('body').readOnly=true;$('finish').disabled=true;$('review').hidden=false;let a=rows(),avg=a.length?Math.round(a.reduce((s,x)=>s+Array.from(x).length,0)/a.length):0;$('checks').replaceChildren();for(let s of [($('title').value.trim()?'✓':'△')+' タイトル', (a.length>=4&&a.length<=6?'✓':'△')+' '+a.length+'項目（目安4〜6）',(avg>=20&&avg<=30?'✓':'△')+' 平均'+avg+'文字（目安20〜30）',elapsed+'秒で終了',a.length<4?'次回は理由や具体的な状況も書いてみよう。':'次に深掘りしたい問いを考えてみよう。']){let p=document.createElement('p');p.textContent=s;$('checks').append(p)}if(!restore)$('category').value=classify($('title').value+$('body').value);draft();tick()}$('finish').onclick=()=>finish();$('category').oninput=draft;$('self').onchange=draft;$('next').onclick=()=>{if(!ended)return;data.notes.unshift({title:$('title').value||'無題',body:$('body').value,day:day(),category:$('category').value||'その他',elapsed,self:$('self').checked});data.draft=null;persist();start=null;ended=false;elapsed=0;$('title').value=$('body').value=$('category').value='';$('self').checked=false;$('title').readOnly=$('body').readOnly=false;$('finish').disabled=false;$('review').hidden=true;progress();tick();$('title').focus()};function render(){let q=$('search').value.toLowerCase();$('list').replaceChildren();for(let n of data.notes.filter(n=>(n.title+n.body+n.category).toLowerCase().includes(q))){let a=document.createElement('article'),h=document.createElement('strong'),m=document.createElement('p'),p=document.createElement('pre');h.textContent=n.title;m.textContent=n.day+' / '+n.category;p.textContent=n.body;a.append(h,m,p);$('list').append(a)}}$('search').oninput=render;$('files').onclick=()=>{$('editor').hidden=true;$('library').hidden=false;render()};$('write').onclick=()=>{$('editor').hidden=false;$('library').hidden=true};$('backup').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='zero-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};if(data.draft){let d=data.draft;$('title').value=d.title;$('body').value=d.body;$('category').value=d.category||'';$('self').checked=!!d.self;start=d.start;elapsed=d.elapsed||0;if(d.ended)finish(true)}data.journals=data.journals||{};function report(mode){$('editor').hidden=$('library').hidden=true;$('report').hidden=false;$('reportTitle').textContent=mode==='daily'?'1日の振り返り':'思考の変化';let c=$('reportControls'),out=$('reportBody');c.replaceChildren();function add(tag,s,parent=out){let n=document.createElement(tag);n.textContent=s;parent.append(n);return n}function show(a){out.replaceChildren();let counts=new Map();a.forEach(n=>counts.set(n.category,(counts.get(n.category)||0)+1));add('p',a.length+'枚');for(let [k,v] of counts)add('p',k+'：'+v+'枚');for(let n of a){let d=add('details','');add('summary',n.day+' '+n.title,d);add('pre',n.body,d)}}if(mode==='daily'){let d=add('input','',c);d.type='date';let now=new Date();d.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');function refresh(){let k=d.value.split('-').map(Number).join('/');show(data.notes.filter(n=>n.day===k));let j=data.journals[k]||{};add('p','今日の気づき');let i=add('textarea','');i.value=j.insight||'';add('p','明日掘り下げたい問い');let t=add('textarea','');t.value=j.tomorrow||'';add('button','振り返りを保存').onclick=()=>{data.journals[k]={insight:i.value,tomorrow:t.value};persist();$('status').textContent='振り返りを保存しました'}}d.onchange=refresh;refresh()}else{add('p','累計 '+data.notes.length+'枚 / '+new Set(data.notes.map(n=>n.day)).size+'日',c);let s=add('select','',c);add('option','すべて',s);for(let k of new Set(data.notes.map(n=>n.category)))add('option',k,s);s.onchange=()=>show(data.notes.filter(n=>s.value==='すべて'||n.category===s.value).slice().reverse());s.onchange();add('p','分類別の時系列表示。AIによる意味の分析は未実装。',c)}}$('daily').onclick=()=>report('daily');$('analysis').onclick=()=>report('analysis');for(let id of ['write','files']){let old=$(id).onclick;$(id).onclick=()=>{$('report').hidden=true;old()}}progress();tick();setInterval(()=>{tick();progress()},250);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
