function answeredIds(){return new Set(data.notes.filter(n=>Number.isInteger(n.questionId)&&n.questionId>=0&&n.questionId<questions.length).map(n=>n.questionId))}
function nextQuestion(){let a=answeredIds();return questions.findIndex((q,i)=>!a.has(i))}
function updateQuestion(){let i=nextQuestion(),a=answeredIds(),today=data.notes.filter(n=>n.questionId!=null&&n.day===day()).length;$('questionProgress').textContent=a.size+' / 1000問 ・ 今日 '+today+'問'+(today?' ✓':'');$('questionText').textContent=i<0?'1000問達成！':(i+1)+'問目｜'+questions[i].category+'：'+questions[i].text;$('questionStart').disabled=i<0;$('questionStart').textContent=today?'次の質問に進む':'この問いを書く'}
$('questionStart').onclick=()=>{let i=nextQuestion();if(i<0)return;if(activeQuestionId===i){$('body').focus();return}if(ended||$('title').value.trim()||$('body').value.trim()){$('status').textContent='今のメモを保存してから次の問いを書いてください。';return}activeQuestion=day();activeQuestionId=i;$('title').value=questions[i].text;$('category').value='自己分析';draft();$('body').focus()};
$('questionHistory').onclick=()=>{$('editor').hidden=$('library').hidden=true;$('report').hidden=false;$('reportTitle').textContent='自己分析・回答履歴';$('reportControls').replaceChildren();let out=$('reportBody');out.replaceChildren();for(let n of data.notes.filter(n=>n.questionDay)){let d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=n.day+' '+(Number.isInteger(n.questionId)?(n.questionId+1)+'問目 '+questions[n.questionId]?.category+' ':'')+n.title;p.textContent=n.body;d.append(s,p);out.append(d)}if(!out.children.length)out.textContent='まだ回答がありません。'};
updateQuestion();setInterval(updateQuestion,30000);
